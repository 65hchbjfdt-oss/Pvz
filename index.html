<script>
/* -------------------------------------------------------------------------
   МОДУЛЬ: ElevationModule — высотный профиль и анализ сегментов.
   Реальных данных SRTM нет (мок согласно ТЗ), поэтому высота генерируется
   шумом Перлина, привязанным к пройденной дистанции маршрута — это даёт
   правдоподобный, гладкий, но не повторяющийся рельеф для каждого маршрута.
   Также реализует автоматическое определение сегментов: подъёмы, спуски,
   спринты (по производной высоты и по скорости).
------------------------------------------------------------------------- */
const ElevationModule = {
  // Сгенерировать профиль высоты: возвращает массив точек {distM, eleM, gradePct}
  generateProfile(latlngs, totalDistM){
    const N = Math.max(20, Math.min(200, Math.round(totalDistM/50)));
    const seed = Math.round(latlngs[0][0]*1000 + latlngs[0][1]*1000);
    const baseNoise = Utils.perlin1D(N, seed);
    const fineNoise = Utils.perlin1D(N, seed+999);
    const baseElevation = 20 + Math.abs(seed % 60); // "база" высоты местности
    const profile = [];
    for(let i=0;i<N;i++){
      const distM = (i/(N-1)) * totalDistM;
      // Крупный рельеф (холмы) + мелкий "шум дороги", амплитуды подобраны,
      // чтобы получались реалистичные для городской вело-поездки уклоны.
      const ele = baseElevation + baseNoise[i]*38 + fineNoise[i]*6;
      profile.push({ distM, eleM: Math.max(0, ele) });
    }
    // Уклон между соседними точками, %
    for(let i=0;i<profile.length;i++){
      if(i===0){ profile[i].gradePct = 0; continue; }
      const dEle = profile[i].eleM - profile[i-1].eleM;
      const dDist = Math.max(1, profile[i].distM - profile[i-1].distM);
      profile[i].gradePct = (dEle/dDist)*100;
    }
    return profile;
  },

  totalElevationGain(profile){
    let gain = 0;
    for(let i=1;i<profile.length;i++){ const d = profile[i].eleM-profile[i-1].eleM; if(d>0) gain += d; }
    return Math.round(gain);
  },

  // Найти максимальный уклон на маршруте (для предупреждения о крутых подъёмах)
  maxGrade(profile){
    return profile.reduce((m,p)=>Math.max(m,p.gradePct), 0);
  },

  /* Автоматическое определение сегментов маршрута: подъём / спуск / спринт.
     Подъём: gradePct > 3% на протяжении >150м. Спуск: gradePct < -3%.
     Спринт определяется не по высоте, а по скорости (см. StatsModule). */
  detectClimbsDescents(profile){
    const segments = [];
    let cur = null;
    profile.forEach((p,i)=>{
      const type = p.gradePct > 3 ? 'climb' : (p.gradePct < -3 ? 'descent' : null);
      if(type){
        if(cur && cur.type===type){ cur.endDistM = p.distM; cur.endEleM = p.eleM; }
        else { if(cur) segments.push(cur); cur = {type, startDistM: profile[Math.max(0,i-1)].distM, endDistM:p.distM, startEleM:profile[Math.max(0,i-1)].eleM, endEleM:p.eleM}; }
      } else if(cur){ segments.push(cur); cur=null; }
    });
    if(cur) segments.push(cur);
    return segments.filter(s => (s.endDistM-s.startDistM) > 120)
      .map(s=>({...s, lengthM: Math.round(s.endDistM-s.startDistM), eleChangeM: Math.round(s.endEleM-s.startEleM)}));
  },

  /* Отрисовка профиля высоты на Canvas с градиентной заливкой
     зелёный (равнина) -> красный (крутой подъём), согласно ТЗ. */
  drawProfileCanvas(canvas, profile, progressRatio){
    if(!canvas || !profile || !profile.length) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 300, h = canvas.clientHeight || 120;
    canvas.width = w*dpr; canvas.height = h*dpr;
    const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);

    const minE = Math.min(...profile.map(p=>p.eleM)), maxE = Math.max(...profile.map(p=>p.eleM));
    const range = Math.max(1, maxE-minE);
    const maxD = profile[profile.length-1].distM || 1;

    const pts = profile.map(p=>({
      x: (p.distM/maxD) * w,
      y: h - 8 - ((p.eleM-minE)/range) * (h-20),
      grade: p.gradePct
    }));

    // Заливка под кривой, цвет каждого мини-сегмента зависит от уклона
    for(let i=1;i<pts.length;i++){
      const grade = Utils.clamp(pts[i].grade, -10, 10);
      const t = (grade+10)/20; // 0=спуск(зелёный), 1=подъём(красный)
      const r = Math.round(Utils.lerp(0,255,t)), g = Math.round(Utils.lerp(255,20,t));
      ctx.fillStyle = `rgba(${r},${g},65,0.35)`;
      ctx.strokeStyle = `rgba(${r},${g},65,0.95)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pts[i-1].x, h); ctx.lineTo(pts[i-1].x,pts[i-1].y); ctx.lineTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i].x,h);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(pts[i-1].x,pts[i-1].y); ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
    }

    // Маркер текущего прогресса по маршруту
    if(typeof progressRatio === 'number'){
      const px = Utils.clamp(progressRatio,0,1) * w;
      ctx.strokeStyle = '#00FF41'; ctx.lineWidth = 2; ctx.shadowColor='#00FF41'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,h); ctx.stroke();
      ctx.shadowBlur=0;
    }
  }
};

/* -------------------------------------------------------------------------
   МОДУЛЬ: StatsModule — расчётная система уровня Strava.
   Калории (формула MET с учётом веса/возраста/пульса/рельефа), мощность
   (Вт, оценка по скорости и уклону), темп, обнаружение спринтов по скорости,
   а также подготовка данных для графиков Chart.js.
------------------------------------------------------------------------- */
const StatsModule = {
  charts: {},

  /* MET (Metabolic Equivalent of Task) — стандартная методика оценки
     энергозатрат. Базовое MET для езды на велосипеде зависит от скорости,
     дополнительно корректируется уклоном (подъём расходует больше энергии)
     и используется формула: ккал/мин = MET * 3.5 * вес(кг) / 200 */
  metForSpeed(speedKmh, gradePct){
    let met;
    if(speedKmh < 16) met = 4.0;
    else if(speedKmh < 19) met = 6.8;
    else if(speedKmh < 22) met = 8.0;
    else if(speedKmh < 26) met = 10.0;
    else if(speedKmh < 30) met = 12.0;
    else met = 15.8;
    // Поправка на уклон: +0.3 MET за каждый % положительного уклона
    if(gradePct > 0) met += gradePct * 0.3;
    return Math.max(2.5, met);
  },
  caloriesForInterval(speedKmh, gradePct, dtSec, weightKg){
    const met = this.metForSpeed(speedKmh, gradePct);
    const kcalPerMin = met * 3.5 * weightKg / 200;
    return kcalPerMin * (dtSec/60);
  },

  /* Оценка мощности (Вт) — упрощённая физическая модель: мощность на
     преодоление сопротивления качению + аэродинамики + подъём в гору.
     P = (Crr*m*g + 0.5*Cd*A*rho*v^2 + m*g*sin(slope)) * v   */
  estimatePowerW(speedKmh, gradePct, weightKg){
    const v = speedKmh/3.6; // м/с
    if(v <= 0) return 0;
    const m = weightKg + 12; // + масса велосипеда
    const g = 9.81;
    const Crr = 0.005, Cd_A = 0.36, rho = 1.225;
    const slope = Math.atan((gradePct||0)/100);
    const Froll = Crr*m*g*Math.cos(slope);
    const Faero = 0.5*Cd_A*rho*v*v;
    const Fgrav = m*g*Math.sin(slope);
    const Ftotal = Math.max(0, Froll+Faero+Fgrav);
    return Ftotal*v;
  },

  // Темп в секундах на километр
  paceSecPerKm(speedKmh){
    if(speedKmh<=0) return Infinity;
    return 3600/speedKmh;
  },

  /* Обнаружение спринтов: участок трека, где скорость превышает
     среднюю скорость поездки более чем на 35%, длительностью от 8 секунд. */
  detectSprints(speedHistory){
    if(speedHistory.length < 5) return [];
    const avg = speedHistory.reduce((s,p)=>s+p.speed,0)/speedHistory.length;
    const threshold = avg*1.35;
    const sprints = []; let cur=null;
    speedHistory.forEach((p,i)=>{
      if(p.speed > threshold){
        if(!cur) cur = {startT:p.t, endT:p.t, maxSpeed:p.speed};
        else { cur.endT = p.t; cur.maxSpeed = Math.max(cur.maxSpeed,p.speed); }
      } else if(cur){ if(cur.endT-cur.startT >= 8000) sprints.push(cur); cur=null; }
    });
    if(cur && cur.endT-cur.startT>=8000) sprints.push(cur);
    return sprints;
  },

  /* Рекомендация перекуса по сожжённым калориям — простой мок-словарь
     с порогами; в реальном приложении заменился бы на API питания. */
  snackRecommendation(caloriesKcal){
    if(caloriesKcal < 150) return {icon:'🍌', text:'Банан или горсть орехов восполнят энергию для короткой поездки.'};
    if(caloriesKcal < 400) return {icon:'🥪', text:'Сэндвич с цельнозерновым хлебом и изотоник — оптимально для восстановления.'};
    if(caloriesKcal < 700) return {icon:'🍝', text:'Порция пасты или риса с белком поможет восполнить запасы гликогена.'};
    return {icon:'🍲', text:'Полноценный приём пищи с углеводами и белком 3:1 — у вас была серьёзная нагрузка!'};
  },

  // Инициализация трёх графиков Chart.js (скорость, высота, сравнение)
  initCharts(){
    const darkGrid = {color:'rgba(255,255,255,0.05)'};
    const tickColor = '#7FA98B';
    const common = {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{backgroundColor:'#111', borderColor:'#00FF41', borderWidth:1, titleColor:'#00FF41', bodyColor:'#E8FFEA'} },
      scales:{ x:{grid:darkGrid, ticks:{color:tickColor, font:{size:9}}}, y:{grid:darkGrid, ticks:{color:tickColor, font:{size:9}}} }
    };
    this.charts.speed = new Chart(document.getElementById('chart-speed'), {
      type:'line',
      data:{ labels:[], datasets:[{ data:[], borderColor:'#00FF41', backgroundColor:'rgba(0,255,65,0.12)', fill:true, tension:0.35, pointRadius:0, borderWidth:2 }]},
      options: common
    });
    this.charts.elev = new Chart(document.getElementById('chart-elev'), {
      type:'line',
      data:{ labels:[], datasets:[{ data:[], borderColor:'#FF8A00', backgroundColor:'rgba(255,138,0,0.12)', fill:true, tension:0.4, pointRadius:0, borderWidth:2 }]},
      options: common
    });
    this.charts.compare = new Chart(document.getElementById('chart-compare'), {
      type:'bar',
      data:{ labels:['3 поездки назад','2 поездки назад','Прошлая','Текущая'],
        datasets:[{ data:[0,0,0,0], backgroundColor:['#2a2a2a','#2a2a2a','#2a2a2a','#00FF41'], borderRadius:6, borderSkipped:false }]},
      options: { ...common, plugins:{...common.plugins} }
    });
  },

  updateSpeedChart(speedHistory){
    if(!this.charts.speed) return;
    const sliced = speedHistory.slice(-120);
    this.charts.speed.data.labels = sliced.map(p=>'');
    this.charts.speed.data.datasets[0].data = sliced.map(p=>p.speed.toFixed(1));
    this.charts.speed.update('none');
  },
  updateElevChart(profile){
    if(!this.charts.elev) return;
    this.charts.elev.data.labels = profile.map(p=>(p.distM/1000).toFixed(1));
    this.charts.elev.data.datasets[0].data = profile.map(p=>Math.round(p.eleM));
    this.charts.elev.update('none');
  },
  updateCompareChart(currentDistKm){
    if(!this.charts.compare) return;
    // Мок-история прошлых поездок (детерминированный псевдослучайный разброс)
    const mockPast = [ (currentDistKm*0.8)+Math.random()*2, (currentDistKm*1.1)+Math.random()*2, (currentDistKm*0.95)+Math.random()*1.5 ];
    this.charts.compare.data.datasets[0].data = [...mockPast.map(v=>v.toFixed(1)), currentDistKm.toFixed(1)];
    this.charts.compare.update('none');
  }
};
</script>
